name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  ZIG_PUBKEY: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
  ZIGBUILD_VERSION: "0.23.4"
  PACKAGER_VERSION: "0.11.8"

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            package: app
          - target: x86_64-apple-darwin
            runner: macos-15
            package: app
          - target: x86_64-unknown-linux-gnu
            zigbuild: x86_64-unknown-linux-gnu.2.28
            runner: ubuntu-latest
            package: deb
            rpm: x86_64
          - target: aarch64-unknown-linux-gnu
            zigbuild: aarch64-unknown-linux-gnu.2.28
            runner: ubuntu-latest
            package: deb
            rpm: aarch64
          - target: armv7-unknown-linux-gnueabihf
            zigbuild: armv7-unknown-linux-gnueabihf.2.28
            runner: ubuntu-latest
            package: deb
            rpm: armv7hl
          - target: x86_64-pc-windows-gnullvm
            zigbuild: x86_64-pc-windows-gnullvm
            runner: ubuntu-latest
          - target: i686-pc-windows-gnullvm
            zigbuild: i686-pc-windows-gnullvm
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: zerowave-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add the Rust target
        run: rustup target add "$TARGET"

      - name: Install zig
        if: matrix.zigbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          url="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/zig.tar.xz.minisig" "$url.minisig"
          minisign -Vm "$RUNNER_TEMP/zig.tar.xz" -x "$RUNNER_TEMP/zig.tar.xz.minisig" -P "$ZIG_PUBKEY"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Restore cargo-zigbuild
        id: zigbuild
        if: matrix.zigbuild
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIGBUILD_VERSION }}

      - name: Install cargo-zigbuild
        if: matrix.zigbuild && steps.zigbuild.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-zigbuild@$ZIGBUILD_VERSION"

      - name: Build
        if: ${{ !matrix.zigbuild }}
        working-directory: deck
        run: cargo build --profile dist --target "$TARGET"

      - name: Cross-build with zig
        if: matrix.zigbuild
        working-directory: deck
        run: cargo zigbuild --profile dist --target ${{ matrix.zigbuild }}

      - name: Make the archive
        run: |
          mkdir -p "release/$ARCHIVE"
          cp LICENSE NOTICE README.md "release/$ARCHIVE/"
          cd release
          if [ "$TARGET" = x86_64-pc-windows-gnullvm ]; then
            cp "../deck/target/$TARGET/dist/ZeroWave.exe" "$ARCHIVE/"
            zip -qr "$ARCHIVE.zip" "$ARCHIVE"
            shasum -a 256 "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          else
            cp "../deck/target/$TARGET/dist/ZeroWave" "$ARCHIVE/"
            tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi
          rm -r "$ARCHIVE"

      - name: Restore cargo-packager
        id: packager
        if: matrix.package
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-${{ runner.os }}-${{ runner.arch }}-${{ env.PACKAGER_VERSION }}

      - name: Install cargo-packager
        if: matrix.package && steps.packager.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-packager@$PACKAGER_VERSION"

      - name: Package
        if: matrix.package
        working-directory: deck
        run: cargo packager --profile dist --target "$TARGET" --formats ${{ matrix.package }} --out-dir ../target/packages

      - name: Sign the app
        if: matrix.package == 'app'
        run: |
          codesign --force --sign - target/packages/ZeroWave.app
          codesign --verify --strict target/packages/ZeroWave.app

      - name: Zip the app
        if: matrix.package == 'app'
        run: ditto -c -k --keepParent target/packages/ZeroWave.app "release/ZeroWave-$TARGET.app.zip"

      - name: Collect the deb
        if: matrix.package == 'deb'
        run: mv target/packages/*.deb release/

      - name: Install rpmbuild
        if: matrix.rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build the rpm
        if: matrix.rpm
        run: |
          version="${GITHUB_REF_NAME#v}"
          rpmbuild -bb --target ${{ matrix.rpm }} \
            --define "_topdir $RUNNER_TEMP/rpm" \
            --define "zw_version ${version//-/\~}" \
            --define "zw_root $PWD" \
            --define "zw_binary $PWD/deck/target/$TARGET/dist/ZeroWave" \
            deck/linux/zerowave.spec
          mv "$RUNNER_TEMP"/rpm/RPMS/*/*.rpm release/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --title "ZeroWave ${TAG#v}" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
