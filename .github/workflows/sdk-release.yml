name: SDK Release

on:
  push:
    tags:
      - "sdk-v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Release JavaScript runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the JavaScript runtime
        run: |
          rustup target add wasm32-wasip1
          sh sdk/javy/build.sh

      - name: Prepare the runtime
        run: |
          mkdir -p release
          cp sdk/ts/zwjs.wasm release/zwjs.wasm
          cd release
          sha256sum zwjs.wasm > zwjs.wasm.sha256

      - name: Create the SDK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "${TAG#sdk-v}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" release/zwjs.wasm release/zwjs.wasm.sha256 \
            --repo "$REPO" \
            --title "ZeroWave SDK ${TAG#sdk-v}" \
            --notes "JavaScript runtime for the ZeroWave TypeScript SDK." \
            --verify-tag \
            --latest=false \
            "${prerelease[@]}"
