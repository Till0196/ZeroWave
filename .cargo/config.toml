[alias]
win = "zigbuild --release --target x86_64-pc-windows-gnullvm"
win32 = "zigbuild --release --target i686-pc-windows-gnullvm"
linux = "zigbuild --release --target x86_64-unknown-linux-gnu.2.28"
linux-old = "zigbuild --release --target x86_64-unknown-linux-gnu.2.17"
linux-arm64 = "zigbuild --release --target aarch64-unknown-linux-gnu.2.28"
linux-armhf = "zigbuild --release --target armv7-unknown-linux-gnueabihf.2.28"
winq = "zigbuild --profile quick --target x86_64-pc-windows-gnullvm"

[env]
# macOS 向けは 13.0 以降で動くように組む（.app の minimum-system-version と同じ）。
MACOSX_DEPLOYMENT_TARGET = "13.0"

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]
