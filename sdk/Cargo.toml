[package]
name = "zwsdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ZeroWave のプラグイン（wasm）の SDK：プラグイン側（plug）、ホスト側（host）、メッセージの型（layer・video・ui・control）、フォント（fonts）、ホスト側のレンダリング（draw）、通信の口（net）"

[lints]
workspace = true

[features]
default = []
# wasmtime に依存するので wasm32 ではビルドできない。guest は default-features = false で依存する。
# draw（canvas 2D のレンダリング）もホスト側だけ。プラグインは描画の依存を持たない。
host = [
    "dep:wasmtime",
    "dep:coax",
    "dep:skrifa",
    "dep:memmap2",
    "dep:vello_cpu",
    "dep:glifo",
    "dep:parley",
    "dep:bytemuck",
    "dep:parlance",
    "dep:windows",
    "dep:ring",
]

[dependencies]
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vello_cpu = { version = "0.3", optional = true }
# vello_cpu の字形の描き方（太字の合成）の型。vello_cpu と同じ版に揃える。
glifo = { version = "0.5", default-features = false, optional = true }
parley = { version = "0.12", default-features = false, features = ["std", "bytemuck"], optional = true }
bytemuck = { version = "1", optional = true }
parlance = { version = "0.1", optional = true }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"], optional = true }
coax = { workspace = true, optional = true }
# parley（fontique）と同じバージョンに揃える。
skrifa = { version = "0.50", optional = true }
memmap2 = { version = "0.9", optional = true }
# 乱数（`crypto.getRandomValues`）。
ring = { version = "0.17", optional = true }

# `zw_sock_v1` の名前付きパイプ（ホスト側だけ）。windows クレートはほかの OS ではビルドできない。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
], optional = true }

# テストで名前付きパイプのサーバーを立てる。
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
